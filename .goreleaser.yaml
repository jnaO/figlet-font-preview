version: 2

builds:
  - main: ./cmd/figlet-font-preview
    binary: figlet-font-preview
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
      - man/*
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: figlet-font-preview
    binaries: [figlet-font-preview]
    manpages: [man/figlet-font-preview.1]
    completions:
      bash: completions/figlet-font-preview.bash
      zsh: completions/figlet-font-preview.zsh
      fish: completions/figlet-font-preview.fish
    homepage: https://github.com/jnaO/figlet-font-preview
    description: Preview text in every installed FIGlet and TOIlet font
    dependencies:
      - formula: figlet
    skip_upload: auto
    repository:
      owner: jnaO
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
