version: 2

builds:
  - main: ./cmd/figlet-font-preview
    binary: figlet-font-preview
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: figlet-font-preview
    binaries: [figlet-font-preview]
    homepage: https://github.com/jnaO/figlet-font-preview
    description: Preview text in every installed FIGlet and TOIlet font
    dependencies:
      - formula: figlet
    skip_upload: auto
    repository:
      owner: jnaO
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        # removes the quarantine bit macOS sets on the unsigned binary
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/figlet-font-preview"]
          end
